workflows:
  ios-ipa:
    name: Nuvio iOS Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m4

    environment:
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
      xcode: latest
    scripts:
      - name: Initialize required MPVKit submodule
        script: |
          git submodule update --init -- MPVKit

      - name: Create local.properties
        script: |
          touch local.properties
      - name: Configure Gradle and Kotlin memory for iOS CI
        script: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          kotlin.native.jvmArgs=-Xmx6g
          org.gradle.parallel=false
          EOF
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Nuvio.app"
          test -d "$APP_PATH" || {
            echo "ERROR: Nuvio.app was not produced"
            find build/ios/DerivedData/Build/Products -maxdepth 3 -name '*.app'
            exit 1
          }

          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Nuvio-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
