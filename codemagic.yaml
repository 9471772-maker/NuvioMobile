workflows:
  ios-ipa:
    name: Nuvio iOS Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m4

    environment:
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        NUVIO_SUPABASE_URL: "https://api.nuvio.tv"
        NUVIO_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI"
      xcode: latest
    scripts:
      - name: Prepare iOS native dependencies
        script: |
          ./scripts/prepare-ios-dependencies.sh

      - name: Create local.properties
        script: |
          touch local.properties
      - name: Configure Gradle and Kotlin memory for iOS CI
        script: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1g
          kotlin.native.jvmArgs=-Xmx9g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.configuration-cache=false
          EOF
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Nuvio.app"
          test -d "$APP_PATH" || {
            echo "ERROR: Nuvio.app was not produced"
            find build/ios/DerivedData/Build/Products -maxdepth 3 -name '*.app'
            exit 1
          }

          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Nuvio-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
